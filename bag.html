<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOUR TYPE — Your Bag</title><link rel="stylesheet" href="style.css"><style>
:root{--bg:#070707;--panel:#0d0d0d;--line:#242424;--text:#f2f2f2;--muted:#858585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.bagPage{min-height:100vh}.bagTop{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,64px);position:sticky;top:0;background:rgba(7,7,7,.94);backdrop-filter:blur(12px);z-index:5}.brand{font-family:Georgia,serif;font-size:25px;letter-spacing:8px}.topLink{color:#aaa;text-decoration:none;font-size:10px;letter-spacing:2px}.bagWrap{width:min(1240px,calc(100% - 40px));margin:auto;padding:58px 0 80px}.eyebrow{font-size:10px;letter-spacing:4px;color:#777;margin:0 0 14px}.bagTitle{font-family:Georgia,serif;font-size:clamp(44px,7vw,82px);font-weight:400;letter-spacing:-3px;margin:0}.lead{color:#777;margin:12px 0 45px}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.7fr);gap:24px}.itemsHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;font-size:11px;letter-spacing:3px}.itemsHead button{background:none;border:0;color:#aaa;font-size:10px;letter-spacing:2px}.item{border:1px solid var(--line);background:linear-gradient(135deg,#0b0b0b,#090909);padding:18px;display:grid;grid-template-columns:180px 1fr;gap:25px;margin-bottom:14px;border-radius:4px}.itemImg{width:100%;aspect-ratio:4/5;object-fit:cover;background:#151515}.itemMain{display:flex;flex-direction:column;min-width:0}.itemTop{display:flex;justify-content:space-between;gap:15px}.itemName{font-size:18px;margin:0 0 6px}.itemPrice{font-size:14px;color:#ddd}.remove{background:none;border:0;color:#777;font-size:24px;cursor:pointer}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}.choiceGroup{margin-right:25px}.choiceLabel{font-size:9px;letter-spacing:2px;color:#666;margin-bottom:8px}.choices button{min-width:42px;height:38px;padding:0 11px;border:1px solid #292929;background:#0a0a0a;color:#aaa;cursor:pointer}.choices button.selected{background:#eee;color:#080808;border-color:#eee}.colorChoice{display:flex;align-items:center;gap:7px}.dot{width:10px;height:10px;border-radius:50%;border:1px solid #777;display:inline-block}.dot.white{background:#eee}.dot.charcoal{background:#555}.dot.black{background:#050505}.qty{display:flex;align-items:center;border:1px solid #292929;width:max-content;margin-top:25px}.qty button{width:38px;height:36px;border:0;background:#0a0a0a;color:#ddd;font-size:18px}.qty b{width:40px;text-align:center;font-size:12px}.summary{border:1px solid var(--line);padding:25px;align-self:start;position:sticky;top:95px;background:#0a0a0a}.summary h2{font-size:13px;letter-spacing:2px;margin:0 0 25px}.row{display:flex;justify-content:space-between;color:#999;font-size:12px;margin:15px 0}.row.total{border-top:1px solid var(--line);padding-top:20px;color:#eee;font-size:16px;margin-top:22px}.row.total b{font-size:25px}.primary,.secondary{width:100%;min-height:52px;cursor:pointer;font-size:10px;letter-spacing:2px}.primary{background:#eee;color:#070707;border:1px solid #eee;margin-top:20px}.secondary{background:#0a0a0a;color:#ddd;border:1px solid #444;margin-top:10px}.benefits{border-top:1px solid var(--line);margin-top:25px;padding-top:18px}.benefit{padding:12px 0;border-bottom:1px solid #171717}.benefit b{font-size:10px;letter-spacing:1px}.benefit span{display:block;color:#666;font-size:10px;margin-top:4px}.empty{border:1px solid var(--line);padding:70px 25px;text-align:center}.empty h2{font-family:Georgia,serif;font-size:38px;font-weight:400;margin:0 0 12px}.empty p{color:#666}.recommend{margin-top:65px;border-top:1px solid var(--line);padding-top:35px}.recommend h3{font-size:10px;letter-spacing:4px;font-weight:400}.recommend p{color:#666;font-size:12px}.note{font-size:10px;color:#555;line-height:1.7;margin-top:18px}@media(max-width:800px){.bagTop{height:62px;padding:0 18px}.brand{font-size:18px;letter-spacing:5px}.bagWrap{width:min(100% - 28px,650px);padding:35px 0 55px}.bagTitle{font-size:52px}.layout{display:block}.summary{position:static;margin-top:18px}.item{grid-template-columns:100px 1fr;padding:12px;gap:14px}.itemName{font-size:14px}.choices{margin-top:17px}.choiceGroup{margin-right:8px}.choices button{height:34px;min-width:36px;font-size:11px}.qty{margin-top:17px}.itemPrice{font-size:12px}.recommend{display:none}}
</style></head><body><main class="bagPage"><header class="bagTop"><a class="topLink" href="index.html">← SHOP</a><div class="brand">YOUR TYPE</div><a class="topLink" href="index.html#shop">CONTINUE SHOPPING</a></header><section class="bagWrap"><p class="eyebrow">YOUR TYPE / BAG</p><h1 class="bagTitle">Make it yours.</h1><p class="lead">Review your pieces, choose your fit, then continue to checkout.</p><div id="content"></div></section></main><script>
function storageGet(key,fallback='[]'){try{const v=localStorage.getItem(key);if(v!==null)return v}catch(e){}try{const m=document.cookie.match(new RegExp('(?:^|; )'+key+'=([^;]*)'));if(m)return decodeURIComponent(m[1])}catch(e){}return fallback}
function storageSet(key,value){const text=typeof value==='string'?value:JSON.stringify(value);try{localStorage.setItem(key,text)}catch(e){}try{document.cookie=key+'='+encodeURIComponent(text)+'; path=/; max-age=31536000; SameSite=Lax'}catch(e){}}
let products=[];try{products=JSON.parse(storageGet('yourTypeProductsCache','[]'))}catch(e){products=[]}let cart=[];try{cart=JSON.parse(storageGet('yourTypeCart','[]'))}catch(e){cart=[]}let bagSettings={shipping:99,freeShipping:999};
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function imageUrl(raw){const v=String(raw||'').trim();if(!v)return '/photos/ornament.jpg';if(/^data:|^https?:|^\//i.test(v))return v;if(/^photos\//i.test(v))return '/'+v;if(/^uploads\//i.test(v))return '/'+v;return '/uploads/'+encodeURIComponent(v)}
function productIdOf(p){return String(p?.[8]||p?.id||'')}
function priceOf(p){return Number(String(p?.[1]??p?.price??0).replace(/[^0-9.]/g,''))||0}
function save(){storageSet('yourTypeCart',cart);render()}function removeItem(i){cart.splice(i,1);save()}function qty(i,d){if(!cart[i])return;cart[i].qty=Math.max(1,Math.min(10,Number(cart[i].qty||1)+d));save()}function setSize(i,s){if(!cart[i])return;cart[i].size=s;save()}function setColor(i,c){if(!cart[i])return;cart[i].color=c;save()}
async function syncCartProducts(){try{const [pr,sc]=await Promise.all([fetch('/api/products',{cache:'no-store'}),fetch('/api/site-config',{cache:'no-store'})]);if(sc.ok){try{const sd=await sc.json();const st=sd.settings||{};bagSettings.shipping=Number(st.shipping??bagSettings.shipping);bagSettings.freeShipping=Number(st.freeShipping??bagSettings.freeShipping)}catch(_){}}if(!pr.ok)return;const d=await pr.json();if(!Array.isArray(d.products))return;products=d.products.map(p=>[p.name,p.price,p.image,p.badge,p.oldPrice||'',p.stock,p.sizes||{S:p.stock,M:p.stock,L:p.stock,XL:p.stock,XXL:p.stock},Number(p.likes||0),p.id,p.colors||['Black','White','Charcoal'],Boolean(p.featured)]);storageSet('yourTypeProductsCache',products);let changed=false;cart=cart.map(item=>{const id=productIdOf(item);const live=d.products.find(p=>String(p.id)===id)||d.products.find(p=>String(p.name)===String(item?.[0]||''));if(!live)return item;const copy={...item};copy[2]=live.image||copy[2];copy[1]=live.price??copy[1];copy[8]=live.id;copy[9]=Array.isArray(live.colors)&&live.colors.length?live.colors:copy[9];changed=true;return copy});if(changed)storageSet('yourTypeCart',cart);render()}catch(_){}}
function render(){
 const el=document.getElementById('content');
 if(!cart.length){el.innerHTML='<div class="empty"><h2>Your bag is empty.</h2><p>Choose a piece from the collection and make it yours.</p><button class="primary" onclick="location.href=\'index.html#shop\'">SHOP THE COLLECTION →</button></div>';return}
 const subtotal=cart.reduce((sum,p)=>sum+priceOf(p)*Number(p.qty||1),0);
 const shipping=subtotal>=Number(bagSettings.freeShipping||999)?0:Number(bagSettings.shipping||99),total=subtotal+shipping;
 const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const items=cart.map((p,i)=>{
   const size=p.size||'M',color=p.color||'Black',q=Number(p.qty||1);
   const colors=Array.isArray(p[9])&&p[9].length?p[9]:['Black','White','Charcoal'];
   return `<article class="item"><img class="itemImg" src="${imageUrl(p[2])}" alt="${safe(p[0]||'Product')}" loading="lazy" onerror="this.src='/photos/ornament.jpg';this.onerror=null"><div class="itemMain"><div class="itemTop"><div><h2 class="itemName">${safe(p[0])}</h2><div class="itemPrice">${safe(p[1])} each</div></div><button class="remove" onclick="removeItem(${i})" aria-label="Remove item">×</button></div><div class="choices"><div class="choiceGroup"><div class="choiceLabel">SIZE</div><div class="choices">${['S','M','L','XL','XXL'].map(sz=>`<button class="${size===sz?'selected':''}" onclick="setSize(${i},'${sz}')">${sz}</button>`).join('')}</div></div><div class="choiceGroup"><div class="choiceLabel">COLOR</div><div class="choices">${colors.map(c=>`<button class="${color===c?'selected':''} colorChoice" onclick="setColor(${i},${JSON.stringify(c)})"><i class="dot ${String(c).toLowerCase()}"></i>${safe(c)}</button>`).join('')}</div></div></div><div class="qty"><button onclick="qty(${i},-1)">−</button><b>${q}</b><button onclick="qty(${i},1)">+</button></div></div></article>`;
 }).join('');
 el.innerHTML=`<div class="layout"><section><div class="itemsHead"><span>ITEMS (${cart.length})</span><button onclick="clearBag()">CLEAR BAG</button></div>${items}</section><aside class="summary"><h2>ORDER SUMMARY</h2><div class="row"><span>Subtotal</span><span>${money(subtotal)}</span></div><div class="row"><span>Shipping</span><span>${shipping?'₹'+shipping:'FREE'}</span></div><div class="row total"><span>Total</span><b>${money(total)}</b></div><button class="primary" onclick="location.href='checkout.html'">PROCEED TO CHECKOUT →</button><button class="secondary" onclick="location.href='index.html#shop'">← CONTINUE SHOPPING</button><div class="benefits"><div class="benefit"><b>PREMIUM QUALITY</b><span>Built for the street.</span></div><div class="benefit"><b>EASY RETURNS</b><span>7-day return policy.</span></div><div class="benefit"><b>SECURE CHECKOUT</b><span>Clear and simple checkout flow.</span></div></div><p class="note">Size, color and quantity are saved in your current bag.</p></aside></div>`;
}
function clearBag(){if(confirm('Clear your bag?')){cart=[];save()}}
window.addEventListener('pageshow',()=>{try{cart=JSON.parse(storageGet('yourTypeCart','[]'))}catch(e){cart=[]}render()});
window.addEventListener('DOMContentLoaded',()=>{try{cart=JSON.parse(storageGet('yourTypeCart','[]'))}catch(e){cart=[]}render()});
window.addEventListener('pagehide',()=>storageSet('yourTypeCart',cart));
render();
syncCartProducts();
</script></body></html>
