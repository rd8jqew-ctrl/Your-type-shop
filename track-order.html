<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — YOUR TYPE</title><link rel="stylesheet" href="legal.css"></head><body><div class="page"><div class="top"><a class="logo" href="index.html">YOUR TYPE</a><a class="back" href="index.html">← SHOP</a></div><div class="eyebrow">YOUR TYPE / INFORMATION</div><h1>Track Order</h1><p class="muted">Enter your order number to see the current status.</p><form onsubmit="event.preventDefault();track()"><input id="id" required placeholder="YT-..." style="padding:13px;width:100%;background:#111;border:1px solid #333;color:#fff"><button style="margin-top:10px;padding:13px 18px" type="submit">TRACK ORDER</button></form><div id="result" class="note" hidden></div><script>async function track(){const id=document.getElementById("id").value.trim();const r=await fetch("/api/orders/"+encodeURIComponent(id));const d=await r.json();const e=document.getElementById("result");e.hidden=false;e.textContent=r.ok?(d.orderId+" — "+d.status+" — ₹"+Number(d.total||0).toLocaleString("en-IN")):(d.error||"Order not found")}</script><footer>© 2026 YOUR TYPE · Store information — verify final business/legal details before launch.</footer></div></body></html>
